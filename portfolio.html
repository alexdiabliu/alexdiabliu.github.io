<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Diab-Liu</title>
    <!--Referencing the CSS sheet and importing it-->
    <link rel="stylesheet" href="styles2.css">
    <script src="https://kit.fontawesome.com/668f49d614.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="/images/pic5.JPG">
</head>
<body>
    <!--Navbar Section-->
    <section id="Home"></section>
    <nav class="navbar">
        <div class="navbar__container">
            <a href="/" id="navbar__logo"><i class="fa-solid fa-computer"></i><pre>  A.K.D-L</pre></a>
            <div class="navbar__toggle" id="mobile-menu">
                <span class="bar"></span><span class="bar"></span><span class="bar"></span>
            </div>
            <ul class="navbar__menu">
                <li class="navbar__item">
                    <a href="index.html#Home" class="navbar__links">Home</a>
                </li>
                <li class="navbar__item">
                    <a href="#Contact" class="navbar__links">Contact</a>
                </li>
                <li class="navbar__btn">
                    <a href="#Home" class="button">Portfolio</a>
                </li>
            </ul>
        </div>
    </nav>

    <!--Hero Section-->
    <div class="main">
      <section id="Portfolio"></section>
        <div class="main__container">
            <div class="main__content">
                <h1>PERSONAL</h1>
                <h3>PROJECT</h3>
                <h2>PORTFOLIO</h2>
                <p>Engineering, Programming, Marketing</p>
            </div>
            <div class="main__img--container">
                <img src="images/pic6.svg" alt="pic" id="main__img">
            </div>
        </div>
    </div>
    
    <!--Services Section-->
    <div class="services">
        <div class="container portfolio-shell">
            <div class="portfolio-heading">
                <p class="portfolio-eyebrow">Selected Work</p>
                <h1>Modern Project Portfolio</h1>
                <p class="portfolio-subtitle">Browse projects by language, framework, and domain with instant filtering.</p>
            </div>

            <div class="portfolio-controls">
                <div class="search-wrap">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <input id="project-search" type="search" placeholder="Search projects, tags, frameworks..." aria-label="Search projects">
                </div>
                <div class="filter-menu" id="dynamic-filter-menu" aria-label="Project filters"></div>
            </div>

            <div class="active-filter-bar" id="active-filter-bar"></div>

            <section id="filterList">
                <div class="filter-item" id="project-grid"></div>
            </section>
        </div>
    </div>
    
   <!--Footer Section-->
   <div class="footer__container">
    <section id="Contact"></section>
    <div class="social__media">
        <div class="social__media--wrap">
            <div class="footer__logo">
                <a href="/" id="footer__logo"><i class="fa-solid fa-computer"></i><pre>  A.K.D-L</pre></a>
            </div>
            <p class="website__rights">alexdiabliu@gmail.com</p>
            <div class="social__icons">
                <a href="https://www.linkedin.com/in/alexdiab-liu/" class="social__icon--link" target="_blank">
                    <i class="fab fa-linkedin"></i>
                </a>
        </div>
  
    <!-- Calls javascript-->
    <script src="app.js"></script>
    <script src="projectsDataClean.js"></script>
    <script src="filter.js"></script>
</body>
</html>
